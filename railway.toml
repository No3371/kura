# Railway deploy: Railpack builds ./cmd/kura into ./out. The SQLite db lives on
# the volume mounted at /data; KURA_USER_AGENT and the advisor keys are set as
# service variables.
[deploy]
startCommand = "./out serve -addr 0.0.0.0:8080 -db /data/kura.db -crawl-on-start -crawl-every 24h -no-crawl-api"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
