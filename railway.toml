# Railway deploy: Railpack builds ./cmd/kura into ./out. The SQLite db lives on
# the volume mounted at /data; KURA_USER_AGENT and the advisor keys are set as
# service variables (TYPESAFE_API_KEY turns on the chat gate in shadow mode).
# -trust-proxy: Railway's edge proxy is the peer, so the chat rate limit keys on
# the last X-Forwarded-For hop.
[deploy]
startCommand = "./out serve -addr 0.0.0.0:8080 -db /data/kura.db -crawl-on-start -crawl-every 24h -no-crawl-api -trust-proxy"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
